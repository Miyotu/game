# Quiz settings
settings:
  # Time limit per question in seconds
  time_limit: 30
  
  # Minimum players to start a quiz
  min_players: 1
  
  # Maximum players in a quiz
  max_players: 20
  
  # Number of questions per quiz session
  questions_per_session: 10
  
  # Reward multipliers based on difficulty
  difficulty_multipliers:
    easy: 1.0
    medium: 1.5
    hard: 2.0
  
  # Streak bonuses (consecutive correct answers)
  streak_bonuses:
    3: 50   # 3 correct answers in a row: +50 points
    5: 100  # 5 correct answers in a row: +100 points
    10: 250 # 10 correct answers in a row: +250 points
  
  # Category bonuses
  category_bonuses:
    minecraft: 1.2  # 20% bonus for Minecraft questions
    geography: 1.0  # No bonus
    history: 1.1    # 10% bonus
    science: 1.3    # 30% bonus
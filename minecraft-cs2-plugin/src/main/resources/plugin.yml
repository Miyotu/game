name: CS2Plugin
version: 1.0.0
main: com.miyotu.cs2plugin.CS2Plugin
author: Miyotu
description: Minecraft Counter-Strike 2 Style Plugin
api-version: 1.20
depend: [Citizens]

commands:
  cs2:
    description: CS2 Plugin main command
    usage: /cs2 <subcommand>
    permission: cs2.use
    aliases: [cs, counter-strike]

permissions:
  cs2.use:
    description: Basic CS2 plugin usage
    default: true
  cs2.admin:
    description: CS2 admin commands
    default: op
  cs2.createlobby:
    description: Create lobbies
    default: op
  cs2.setlobby:
    description: Set lobby spawn points
    default: op
  cs2.join:
    description: Join games
    default: true
  cs2.leave:
    description: Leave games
    default: true
  cs2.team:
    description: Select teams
    default: true